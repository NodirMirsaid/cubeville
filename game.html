<title>Cubeville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
/* Layout: full-screen 3D toy-block world, chunky "pressable cube" HUD pinned to the screen edges */
:root{
  --ink:#1f1b4d; --muted:#6b6894; --paper:#ffffff; --mist:#f1f0ff; --edge:#cfcbf3;
  --sun:#ffc93c; --sun-d:#d99a00; --coral:#ff5d73; --coral-d:#c93a52; --mint:#2ed8a3; --mint-d:#139c74; --sky:#8fd3ff;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body)}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
#c{display:block;width:100%;height:100%}
button{font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
.btn{font-weight:900;font-size:15px;border:0;border-radius:14px;padding:10px 14px;background:var(--paper);color:var(--ink);
  box-shadow:0 4px 0 var(--edge),0 8px 18px rgba(31,27,77,.16);cursor:pointer;line-height:1.1;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge),0 3px 8px rgba(31,27,77,.16)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 var(--sun-d),0 8px 18px rgba(31,27,77,.16)}
.btn.mint{background:var(--mint);color:#06372a;box-shadow:0 4px 0 var(--mint-d),0 8px 18px rgba(31,27,77,.16)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d),0 8px 18px rgba(31,27,77,.16)}
.btn.big{font-size:18px;padding:14px 20px;border-radius:16px}
.btn[disabled]{opacity:.5}

.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
#tl{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
#coinBox{position:relative;display:flex;align-items:center;gap:7px;background:var(--paper);border-radius:14px;padding:8px 12px;font:900 18px var(--f-body);box-shadow:0 4px 0 var(--edge);font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:16px;height:16px;background:var(--sun);border:2px solid var(--sun-d);border-radius:4px;transform:rotate(45deg);vertical-align:middle}
.pop{position:absolute;right:6px;top:100%;font:900 18px var(--f-body);color:var(--sun-d);text-shadow:0 2px 0 #fff;animation:pop .9s ease-out forwards;pointer-events:none}
@keyframes pop{from{transform:translateY(0);opacity:1}to{transform:translateY(26px);opacity:0}}
#titleBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;max-width:calc(100% - 32px)}
#title{font:19px var(--f-display);color:var(--ink);background:rgba(255,255,255,.88);padding:5px 12px;border-radius:12px;text-align:center;text-wrap:balance}
#info{background:rgba(31,27,77,.78);color:#fff;font:800 15px var(--f-body);padding:6px 12px;border-radius:12px;font-variant-numeric:tabular-nums;text-align:center}
#info:empty,#title:empty{display:none}
#big{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:clamp(26px,7vw,44px)/1.15 var(--f-display);color:#fff;text-align:center;
  text-shadow:0 3px 0 var(--ink),0 0 20px rgba(31,27,77,.4);pointer-events:none;width:min(92vw,620px);text-wrap:balance}
#big .b-ico{font-size:1.6em;line-height:1.1}
#big .sw{display:inline-block;width:1em;height:1em;border-radius:.2em;border:4px solid #fff;vertical-align:-.12em;margin-right:.25em;box-shadow:0 3px 0 var(--ink)}
#big small{display:block;font:900 18px var(--f-body);margin-top:6px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 128px);transform:translate(-50%,-10px);background:var(--paper);color:var(--ink);font:900 15px var(--f-body);
  padding:9px 14px;border-radius:14px;box-shadow:0 4px 0 var(--edge);opacity:0;transition:.2s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#flash{position:absolute;inset:0;background:var(--coral);opacity:0;pointer-events:none;transition:opacity .35s}

#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:132px;height:132px;border-radius:50%;
  background:rgba(31,27,77,.14);border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(31,27,77,.18);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--edge);pointer-events:none}
.rb{position:absolute;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:12px;align-items:flex-end}
#bJump{width:86px;height:86px;border-radius:26px;font:30px var(--f-display);padding:0}
#bAct{position:absolute;right:0;bottom:100px;font-size:16px;padding:12px 16px;border-radius:16px;max-width:60vw;white-space:normal;text-align:right}
#bEmote{width:62px;height:62px;border-radius:20px;font-size:30px;padding:0}
@media (hover:hover) and (pointer:fine){#joy{opacity:.55}}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(31,27,77,.25);
  padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:55%;overflow:auto;touch-action:pan-y}
.sheet h3{font:20px var(--f-display);margin:2px 0 10px}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tabs{display:flex;gap:6px}
.tabs button{font:900 14px var(--f-body);border:0;border-radius:12px;padding:8px 12px;background:var(--mist);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.egrid button{font-size:28px;height:50px;border:0;border-radius:14px;background:var(--mist);cursor:pointer;padding:0}
.egrid button:active{transform:scale(.92)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sgrid button{border:0;border-radius:16px;padding:8px 4px;cursor:pointer;font:900 13px var(--f-body);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #fff;box-shadow:0 3px 0 var(--edge)}
.sgrid button span{font-size:30px;line-height:1.1}
.note{font:700 12px var(--f-body);color:var(--muted);margin:10px 0 0}
.cool{opacity:.45;pointer-events:none}

.wsec{margin:12px 0 4px;font:900 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw-row .swb{width:40px;height:40px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 2px var(--edge);cursor:pointer;padding:0}
.sw-row .swb.on{box-shadow:0 0 0 3px var(--ink)}
.wtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}
.wtabs button{flex:none;font:900 13px var(--f-body);border:0;border-radius:12px;padding:8px 11px;background:var(--mist);color:var(--ink);cursor:pointer}
.wtabs button.on{background:var(--ink);color:#fff}
.chip{border:0;border-radius:12px;background:var(--mist);padding:8px 11px;font:800 13px var(--f-body);color:var(--ink);cursor:pointer}
.chip.on{background:#ff7eb6;color:#fff}
.chip.big{font-size:16px;padding:12px 16px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.skc{border:0;border-radius:16px;background:#fff0f7;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 12px var(--f-body);color:var(--ink);box-shadow:0 3px 0 #f6c6dc;min-width:0}
.skc span{font-size:30px;line-height:1.15}.skc small{color:var(--muted)}
.btn.pinkb{background:#ff7eb6;color:#fff;box-shadow:0 4px 0 #d9508f,0 8px 18px rgba(31,27,77,.16)}
.btn.blueb{background:#4ea8ff;color:#fff;box-shadow:0 4px 0 #2a7fd6,0 8px 18px rgba(31,27,77,.16)}
.hat{min-width:78px;border:0;border-radius:14px;background:var(--mist);padding:6px 8px;cursor:pointer;font:800 12px var(--f-body);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.hat span{font-size:24px}
.hat.on{background:var(--ink);color:#fff}
.nick{display:flex;align-items:center;gap:10px;font:900 17px var(--f-body)}

#modal{position:absolute;inset:0;background:rgba(31,27,77,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .card{background:var(--paper);border-radius:24px;padding:20px 18px;width:min(100%,460px);max-height:86%;overflow:auto;box-shadow:0 8px 0 var(--edge),0 20px 50px rgba(31,27,77,.35);text-align:center;touch-action:pan-y}
#modal h2{font:24px var(--f-display);margin:6px 0 6px;text-wrap:balance}
#modal p{margin:6px 0;line-height:1.45}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.res-ico,.card-ico{font-size:64px;line-height:1.1}
.reward{font:900 26px var(--f-body);margin:10px 0 0;display:flex;gap:8px;align-items:center;justify-content:center}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px;text-align:left}
.gcard{border:0;border-radius:18px;padding:10px;cursor:pointer;color:#fff;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-width:0}
.gcard b{font:15px var(--f-display);line-height:1.15}
.gcard span{font-size:30px}
.gcard i{font:800 12px var(--f-body);font-style:normal;opacity:.92}
.rules{text-align:left;margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;background:var(--mist);border-radius:14px;padding:10px 12px;font-weight:800;line-height:1.35}
.rules li em{font-style:normal;font-size:20px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--mist);border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:900;text-align:left}
.tog .sw2{width:52px;height:30px;border-radius:15px;background:var(--edge);position:relative;flex:none;border:0;cursor:pointer}
.tog .sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.tog .sw2.on{background:var(--mint)}
.tog .sw2.on::after{left:25px}
.egg{font-size:80px;display:inline-block;animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.reveal{font-size:90px;animation:grow .4s ease-out}
@keyframes grow{from{transform:scale(.2)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.egg,.reveal,.pop{animation:none}}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--sky);font:28px var(--f-display);color:#fff;text-shadow:0 3px 0 var(--ink)}
/* ---- responsive layer: Roblox-style touch controls, portrait / landscape / tablet ---- */
:root{--joy:clamp(112px,24vmin,176px);--jump:clamp(72px,15vmin,124px)}
#joy{left:0;top:0;bottom:auto;width:var(--joy);height:var(--joy);transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(31,27,77,.2);border:3px solid rgba(255,255,255,.8);box-shadow:0 0 0 2px rgba(31,27,77,.15);opacity:0;pointer-events:none;transition:opacity .15s}
#joy.idle{opacity:.42}
#joy.on{opacity:1;transition:none}
#knob{width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(31,27,77,.3)}
.rb{gap:clamp(10px,2vmin,18px)}
#bJump{width:var(--jump);height:var(--jump);border-radius:50%;background:rgba(31,27,77,.3);border:3px solid rgba(255,255,255,.9);
  color:#fff;font-size:calc(var(--jump)*.4);text-shadow:0 2px 0 rgba(31,27,77,.55);box-shadow:0 4px 16px rgba(31,27,77,.25);backdrop-filter:blur(2px)}
#bJump.down,#bJump:active{background:rgba(31,27,77,.5);transform:scale(.94)}
#bEmote{width:calc(var(--jump)*.66);height:calc(var(--jump)*.66);border-radius:50%;font-size:calc(var(--jump)*.32);
  background:rgba(255,255,255,.85);box-shadow:0 3px 12px rgba(31,27,77,.25)}
#bAct{bottom:calc(var(--jump) + 14px)}
@media (hover:hover) and (pointer:fine){#joy{display:none}}
#app.panel .rb,#app.panel #joy,#app.panel #bAct{display:none}
#plist{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 60px);display:none;
  background:rgba(31,27,77,.62);color:#fff;border-radius:12px;padding:8px 10px;font:800 12px var(--f-body);min-width:150px;max-width:220px;pointer-events:none}
#plist b{display:block;font:900 12px var(--f-body);opacity:.8;margin-bottom:4px;letter-spacing:.04em}
#plist div{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
#plist i{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.6)}
@media (orientation:landscape) and (min-width:900px){#plist{display:block}}

/* phones held sideways: compact chrome */
@media (orientation:landscape) and (max-height:560px){
  .top{padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px)}
  .btn{font-size:13px;padding:7px 10px;border-radius:11px}
  #tl{flex-wrap:nowrap;gap:6px}
  #coinBox{font-size:15px;padding:6px 10px}
  #titleBar{top:calc(env(safe-area-inset-top,0px) + 8px);flex-direction:row;gap:6px;max-width:44vw}
  #title{font-size:13px;padding:4px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #info{font-size:12px;padding:4px 9px;white-space:nowrap}
  #toast{top:calc(env(safe-area-inset-top,0px) + 48px);font-size:13px;padding:7px 12px}
  #big{top:32%;font-size:clamp(20px,6vh,32px)}
  #big small{font-size:14px}
  #bAct{font-size:13px;padding:8px 11px}
  .rb{right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  #modal{padding:10px}
  #modal .card{max-height:94%;padding:14px 16px}
  #modal h2{font-size:20px}
  .res-ico,.card-ico{font-size:44px}
  .ggrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .rules{grid-template-columns:1fr 1fr}
}
/* landscape: menus become a side panel so the game stays visible */
@media (orientation:landscape){
  .sheet{left:auto;top:0;right:0;bottom:0;width:min(440px,46vw);max-height:none;border-radius:24px 0 0 24px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 14px) 16px;box-shadow:-10px 0 30px rgba(31,27,77,.25)}
}
/* tablets */
@media (min-width:768px) and (min-height:700px){
  .btn{font-size:17px;padding:12px 16px;border-radius:16px}
  #coinBox{font-size:21px;padding:10px 14px}
  #title{font-size:22px}
  #info{font-size:17px}
  #toast{font-size:17px}
  .egrid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
  .egrid button{height:60px;font-size:34px}
  .skgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .skc span{font-size:36px}
  .chip{font-size:15px;padding:10px 13px}
  .sw-row .swb{width:48px;height:48px}
  .hat{min-width:92px;font-size:14px}
  .hat span{font-size:30px}
  #modal .card{width:min(100%,600px)}
  .sheet{max-height:46%}
  #bAct{font-size:19px;padding:14px 20px}
}
@media (orientation:landscape) and (min-width:768px) and (min-height:700px){.sheet{max-height:none;width:min(480px,42vw)}}

.sheet{overflow:hidden!important;display:flex;flex-direction:column}
.sbody{overflow:auto;min-height:0;flex:1 1 auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:2px 4px 10px;margin:-2px -4px 0}
#modal .card{overflow:hidden!important;display:flex;flex-direction:column}
.cbody{overflow:auto;min-height:0;flex:1 1 auto;touch-action:pan-y;padding:4px 6px 14px;margin:-4px -6px -10px}
@media (orientation:landscape){#app.panel #toast{left:calc((100% - min(440px,46vw))/2)}}
/* ---- Familiar-to-Roblox-players skin: dark translucent HUD, geometric sans, blue primary ---- */
:root{
  --ink:#ffffff; --muted:#bdbebe; --paper:#232527; --mist:#393b3d; --edge:#191b1d;
  --sun:#335fff; --sun-d:#2447d1; --mint:#00b06f; --mint-d:#008a57; --coral:#e8453c; --coral-d:#b8322b; --sky:#7ec3f0;
  --hud:rgba(0,0,0,.48); --hud-on:rgba(0,0,0,.66);
  --f-display:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{color:#fff}
.btn{background:var(--hud);color:#fff;border-radius:10px;box-shadow:none;font-weight:700;letter-spacing:.01em}
.btn:active{transform:scale(.96);box-shadow:none;background:var(--hud-on)}
.btn:focus-visible{outline:2px solid #fff}
.btn.sun{background:var(--sun);box-shadow:none;color:#fff}
.btn.mint{background:var(--mint);color:#fff;box-shadow:none}
.btn.coral{background:var(--coral);color:#fff;box-shadow:none}
.btn.pinkb{background:#e0569e;box-shadow:none}
.btn.blueb{background:var(--sun);box-shadow:none}
.btn.big{border-radius:10px}
#coinBox{background:var(--hud);color:#fff;box-shadow:none;border-radius:10px;font-weight:800}
.pop{color:#ffd23f;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#title{background:none;color:#fff;font:800 20px var(--f-display);padding:0;text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 8px rgba(0,0,0,.45)}
#info{background:var(--hud);border-radius:8px;font-weight:700}
#big{font-family:var(--f-display);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 2px #000,0 0 14px rgba(0,0,0,.35)}
#big small{font-family:var(--f-body);font-weight:700}
#big .sw{border-color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#toast{background:rgba(25,27,29,.9);color:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-weight:700}
#bAct{background:var(--hud);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.55)}
#bEmote{background:var(--hud);box-shadow:none;border:2px solid rgba(255,255,255,.4)}
#bJump{background:rgba(0,0,0,.32);border:3px solid rgba(255,255,255,.75);color:#fff;text-shadow:none;box-shadow:none}
#bJump.down,#bJump:active{background:rgba(0,0,0,.5)}
#joy{background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.55);box-shadow:none}
#knob{background:rgba(255,255,255,.85)}
#plist{background:rgba(0,0,0,.45);border-radius:8px}
.sheet{background:rgba(35,37,39,.97);color:#fff;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
.sheet h3{font:800 20px var(--f-display)}
.tabs button,.wtabs button{background:#393b3d;color:#fff;font-weight:700;border-radius:8px}
.tabs button.on,.wtabs button.on{background:#fff;color:#191b1d}
.egrid button{background:#393b3d;border-radius:8px}
.sgrid button{border:2px solid transparent;box-shadow:none;border-radius:10px;color:#1b2a35}
.chip{background:#393b3d;color:#fff;border-radius:8px;font-weight:700}
.chip.on{background:var(--sun);color:#fff}
.hat{background:#393b3d;color:#fff;border-radius:8px;font-weight:700;border:2px solid transparent}
.hat.on{background:#393b3d;border-color:#fff;color:#fff}
.hat small{color:#bdbebe}
.skc{background:#393b3d;color:#fff;box-shadow:none;border:2px solid transparent;border-radius:8px;font-weight:700}
.skc:hover,.skc:focus-visible{border-color:#fff}
.skc small{color:#bdbebe}
.sw-row .swb{border:2px solid #232527;box-shadow:0 0 0 2px #4b4d4f;border-radius:8px}

function brick(hex){
  if(typeof hex!=='string'||hex[0]!=='#'||hex.length!==7)return hex;
  if(brickCache[hex])return brickCache[hex];
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);let best=hex,bd=1e9;

  return brickCache[hex]=best;
}

const GFX={};

function gfxTex(key,w,h,draw,rep){

  const t=new THREE.CanvasTexture(c);t.userData={cached:true};
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
  return GFX[key]=t;
}

const skyMat=new THREE.ShaderMaterial({
  uniforms:{top:{value:new THREE.Color('#4aa8f0')},hor:{value:new THREE.Color('#d8f1ff')},sunDir:{value:new THREE.Vector3(18,32,12).normalize()},sunCol:{value:new THREE.Color('#fff2c2')},sunAmt:{value:1}},
  vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;uniform vec3 sunCol;uniform vec3 sunDir;uniform float sunAmt;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=clamp(d.y,0.0,1.0);vec3 c=mix(hor,top,pow(h,0.5));float s=max(dot(d,sunDir),0.0);c+=sunCol*(smoothstep(0.9975,0.999,s)*0.9+pow(s,24.0)*0.22)*sunAmt;gl_FragColor=vec4(c,1.0);}',
  side:THREE.BackSide,depthWrite:false,depthTest:false

const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,16),skyMat);sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);
const _skyW=new THREE.Color('#ffffff'),_hsl={};
function syncSky(){
  const bg=scene.background;bg.getHSL(_hsl);const l=_hsl.l;
  const U=skyMat.uniforms;
  U.hor.value.copy(bg).lerp(_skyW,.42*clamp(l*1.6,0,1));
  U.top.value.copy(bg).offsetHSL(0,.08,-.16*clamp(l*1.4,0,1));
  U.sunAmt.value=clamp((l-.25)*2.2,0,1);
  scene.fog.color.copy(U.hor.value);
  sky.position.copy(camera.position);
}

  addBox(x,2.9*s,z,2.8*s,1.4*s,2.8*s,p[0],{mat:leafMat(p[0])});
  addBox(x,3.9*s,z,2.15*s,1.1*s,2.15*s,p[1],{mat:leafMat(p[1]),solid:false});
  addBox(x,4.65*s,z,1.25*s,.7*s,1.25*s,p[2],{mat:leafMat(p[2]),solid:false});
  for(let k=0;k<3;k++){const a=R(0,6.28);addBox(x+Math.cos(a)*1.35*s,R(2.5,3.6)*s,z+Math.sin(a)*1.35*s,R(.6,.9)*s,R(.6,.9)*s,R(.6,.9)*s,p[k%3],{mat:leafMat(p[k%3]),solid:false});}
  if(Math.random()<.35){const a=R(0,6.28);addBox(x+Math.cos(a)*1.42*s,2.6*s,z+Math.sin(a)*1.42*s,.22,.22,.22,'#ff4d6d',{solid:false,shadow:false});}
}
const GRASSMATS={};
function scatterGrass(n,rx,rz,cx=0,cz=0){
  const greens=['#5cb85c','#6fcf6f','#4caf50','#7ed957','#8bc34a'],flowers=['#ff6b8b','#ffd23f','#ffffff','#c9a7ff','#ff9ec7'];
  const groups={},q=new THREE.Quaternion(),v=new THREE.Vector3(),sc=new THREE.Vector3(),E=new THREE.Euler();
  let k=0;
  for(let t=0;t<n*3&&k<n;t++){
    const x=cx+R(-rx,rx),z=cz+R(-rz,rz);let blocked=false;
    for(const b of boxes){if(b.w>=80||b.d>=80)continue;if(Math.abs(x-b.x)<b.w/2+.3&&Math.abs(z-b.z)<b.d/2+.3&&b.y-b.h/2<.5){blocked=true;break;}}
    if(blocked)continue;
    const fl=Math.random()<.12,h=fl?R(.35,.5):R(.18,.42),c=fl?pick(flowers):pick(greens);
    E.set(0,R(0,3.14),R(-.18,.18));q.setFromEuler(E);v.set(x,h/2,z);sc.set(fl?.16:.07,h,fl?.16:.07);
    (groups[c]=groups[c]||[]).push(new THREE.Matrix4().compose(v.clone(),q.clone(),sc.clone()));k++;
  }
  for(const c in groups){
    const list=groups[c],m=GRASSMATS[c]||(GRASSMATS[c]=new THREE.MeshLambertMaterial({color:c}));
    const im=new THREE.InstancedMesh(boxGeo,m,list.length);list.forEach((mx,i)=>im.setMatrixAt(i,mx));im.instanceMatrix.needsUpdate=true;world.add(im);
  }
}

function sparkles(x,y,z,col,n=14,rad=1.8,hgt=4){

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;t.userData={};return t;}
const emojiCache=new Map();
function emojiTex(e){
  if(emojiCache.has(e))return emojiCache.get(e);
  const t=canvasTex(128,128,g=>{g.font=`100px ${EF}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,70);});
  t.userData.cached=true;emojiCache.set(e,t);return t;
}
function emojiSprite(e,s=1.5){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(e),transparent:true,depthWrite:false}));sp.scale.set(s,s,1);return sp;}
function textSprite(text,o={}){
  const lines=String(text).split('\n'),fs=o.fs||44,pad=18;
  const c=document.createElement('canvas'),g=c.getContext('2d');
  const font=`800 ${fs}px Montserrat, system-ui, sans-serif`;g.font=font;
  const w=Math.ceil(Math.max(...lines.map(l=>g.measureText(l).width)))+pad*2;
  const h=Math.ceil(lines.length*fs*1.22+pad*1.2);
  c.width=w;c.height=h;g.font=font;
  if(o.bg){g.fillStyle=o.bg;rr(g,0,0,w,h,Math.min(14,h/3));g.fill();}
  g.fillStyle=o.fg||'#ffffff';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  lines.forEach((l,i)=>{const y=pad*.6+fs*1.22*(i+.5)+2;if(!o.bg){g.lineWidth=fs*.18;g.strokeStyle='rgba(0,0,0,.6)';g.strokeText(l,w/2,y);}g.fillText(l,w/2,y);});
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;t.userData={};
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,depthTest:o.depthTest!==false}));
  const H=(o.h||.5)*lines.length;sp.scale.set(H*w/h,H,1);return sp;
}

function heartPath(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.3);g.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);g.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);g.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);g.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);g.closePath();}

const faceCache=new Map();
function faceTex(L){

    g.lineCap='round';g.lineJoin='round';
    const ell=(x,y,rx,ry,c)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();};
    if(mk.has('shadow')){ell(40,50,15,9,'rgba(190,120,255,.5)');ell(88,50,15,9,'rgba(190,120,255,.5)');}
    if(mk.has('blush')){ell(24,80,13,8,'rgba(255,100,150,.5)');ell(104,80,13,8,'rgba(255,100,150,.5)');}
    if(mk.has('freckles')){g.fillStyle='#b5651d';for(const [x,y] of [[20,73],[27,78],[17,80],[108,73],[101,78],[111,80]]){g.beginPath();g.arc(x,y,1.9,0,7);g.fill();}}
    const eye=(x,st)=>{
      if(st==='kawaii'){ell(x,57,10,13,ink);ell(x-3,52,4.3,4.3,'#fff');ell(x+4,62,2,2,'#fff');}
      else if(st==='happy'){g.strokeStyle=ink;g.lineWidth=5;g.beginPath();g.arc(x,63,9,Math.PI*1.1,Math.PI*1.9);g.stroke();}
      else if(st==='star'){starPath(g,x,57,12);g.fillStyle='#ffd23f';g.fill();g.strokeStyle=ink;g.lineWidth=2.5;g.stroke();}
      else if(st==='heart'){heartPath(g,x,46,22);g.fillStyle='#ff4f8b';g.fill();g.strokeStyle=ink;g.lineWidth=2;g.stroke();}
      else{ell(x,54,5.6,11.5,ink);}
    };
    if(L.eyes==='wink'){eye(40,'kawaii');eye(88,'happy');}else{eye(40,L.eyes);eye(88,L.eyes);}
    if(mk.has('lashes')){g.strokeStyle=ink;g.lineWidth=3;for(const [x,s] of [[40,-1],[88,1]]){const ox=x+s*9;g.beginPath();g.moveTo(ox,50);g.lineTo(ox+s*7,44);g.moveTo(ox-s*2,46);g.lineTo(ox+s*2,38);g.stroke();}}

    if(mk.has('sparkle')){g.fillStyle='#fff7a8';for(const [x,y,r] of [[16,44,7],[112,42,7],[106,60,4],[22,60,4]]){starPath(g,x,y,r,4,.35);g.fill();}}
    if(mk.has('heart')){heartPath(g,104,80,15);g.fillStyle='#ff4f8b';g.fill();}
    if(mk.has('star')){starPath(g,23,87,8);g.fillStyle='#ffc93c';g.fill();}
    if(mk.has('whiskers')){g.strokeStyle=ink;g.lineWidth=2.5;for(const s of [-1,1])for(const dy of [-5,1,7]){g.beginPath();g.moveTo(64+s*28,86+dy*.5);g.lineTo(64+s*52,84+dy*1.4);g.stroke();}}

  });

function wpPos(w){return w.b?{x:w.b.x+(w.ox||0),y:topOf(w.b),z:w.b.z+(w.oz||0)}:w;}
function groundAhead(ch,nx,nz,d){
  const px=ch.pos.x+nx*d,pz=ch.pos.z+nz*d;let ok=false;
  for(const b of boxes){
    if(!b.active||Math.abs(px-b.x)>b.w/2||Math.abs(pz-b.z)>b.d/2)continue;
    const tp=topOf(b);
    if(b.kill&&tp>ch.pos.y-.5&&b.y-b.h/2<ch.pos.y+.5)return false;
    if(b.solid&&tp<=ch.pos.y+.45&&tp>=ch.pos.y-1.2)ok=true;
  }
  return ok;
}
function wallAhead(ch,nx,nz,d){
  const px=ch.pos.x+nx*d,pz=ch.pos.z+nz*d;
  for(const b of boxes){
    if(!b.active||!b.solid||Math.abs(px-b.x)>b.w/2+.2||Math.abs(pz-b.z)>b.d/2+.2)continue;
    const tp=topOf(b);if(tp>ch.pos.y+.45&&tp<ch.pos.y+2.2&&b.y-b.h/2<ch.pos.y+1)return true;

  const dx=p.x-b.pos.x,dz=p.z-b.pos.z,hd=Math.hypot(dx,dz),dy=p.y-b.pos.y;

function rayHit(ox,oy,oz,dx,dy,dz,maxD){
  let best=maxD;

    const b=boxes[i];if(!b.solid||!b.active||b.camIgnore)continue;
    const hx=b.w/2,hy=b.h/2,hz=b.d/2;

function updateCamera(dt){

    for(let i=G.timers.length-1;i>=0;i--){if(G.time>=G.timers[i].t){const f=G.timers[i].fn;G.timers.splice(i,1);f();if(G!==g0)return;}}
    for(const a of G.anims)a(G.time,dt);
    for(const b of crumbles){
      if(b.crumbling>0){b.crumbling-=dt;b.mesh.position.x=b.x+Math.sin(G.time*70)*.07;if(b.crumbling<=0){b.crumbling=0;b.active=false;b.mesh.visible=false;b.gone=2.6;b.mesh.position.x=b.x;}}
      else if(b.gone>0){b.gone-=dt;if(b.gone<=0){b.gone=0;b.active=true;b.mesh.visible=true;}}
    }
    for(const o of G.bobs)o.s.position.y=o.y0+Math.sin(G.time*2+o.ph)*.25;
    const lock=G.lock||G.ended,inp=readInput();
    if(player.pose&&player.pose!=='drive'){
      if(!lock&&(Math.hypot(inp.dx,inp.dz)>.3||jumpBuf>0)){standUp();jumpBuf=0;}
      player.vel.set(0,0,0);player.grounded=true;
    }else{
      if(player.vehicle&&jumpBuf>0){jumpBuf=0;honk();}
      if(stepChar(player,dt,lock?0:inp.dx,lock?0:inp.dz,!lock&&jumpBuf>0)){jumpBuf=0;sfx('jump');}
    }
    jumpBuf-=dt;
    touchCheck(player);if(G!==g0)return;
    if(player.pos.y<G.killY){killChar(player);if(G!==g0)return;}
    for(const b of bots){
      if(b.out)continue;
      const c=(b.brain&&!lock)?b.brain(dt):{dx:0,dz:0};
      stepChar(b,dt,c.dx||0,c.dz||0,!!c.jump);
      touchCheck(b);if(G!==g0)return;
      if(b.pos.y<G.killY){killChar(b);if(G!==g0)return;}
      if(!b.quiet){b.nextEmote-=dt;if(b.nextEmote<=0){b.nextEmote=R(G.emote[0],G.emote[1]);showBubble(b,Math.random()<.25?pick(STICKERS):{e:pick(EMOJI)});}}
    }
    G.update(dt);if(G!==g0)return;
    netTick(dt);
    if((cam.shift||cam.fp)&&!player.vehicle&&!player.pose&&!cam.mode)player.face=cam.yaw+Math.PI;
    if(jumpHeld)jumpBuf=Math.max(jumpBuf,.06);
    player.sync(dt);for(const b of bots)b.sync(dt);
    G.pl=(G.pl||0)-dt;if(G.pl<=0){G.pl=2;renderPlist();}
    const inf=G.info();if(inf!==lastInfo){lastInfo=inf;$('#info').textContent=inf;}
    updateAct();
  }
  syncPanel();
  animTextures(dt);
  if(player){updateCamera(dt);syncSky();renderer.render(scene,camera);}
}

const PETS={'🐶':['Пёсик',1],'🐱':['Котик',1],'🐰':['Зайка',1],'🐥':['Цыпа',1],'🦊':['Лисёнок',2],'🐼':['Панда',2],'🐨':['Коала',2],'🦉':['Совушка',3],'🦁':['Львёнок',4],'🦄':['Единорог',5],'🐲':['Дракоша',6]};
const EGGS=[{n:'Простое',p:60,e:'🥚',pool:['🐶','🐱','🐰','🐥'],c:'#fff3b0'},{n:'Редкое',p:200,e:'🪺',pool:['🦊','🐼','🐨','🦉'],c:'#cdb4db'},{n:'Легенда',p:600,e:'🌟',pool:['🦁','🦄','🐲'],c:'#ffd6a5'}];
function petMult(){const pw=S.pets.map(p=>(PETS[p]||[0,1])[1]).sort((a,b)=>b-a).slice(0,3);return 1+pw.reduce((a,b)=>a+b,0);}
function startPets(G){
  freshLevel({sky:'#b8f2e6'});
  plat(0,0,0,64,64,'#8ed081',{mat:groundMat('#5fa04e',64,64,'grass')});walls(64,64,1.2,'#c68b59');after(.05,()=>scatterGrass(700,30,30));

  G.spawn={x:0,y:0,z:6};
  const coins=[];
  const spawnCoin=()=>{const gem=Math.random()<.08;const m=new THREE.Mesh(boxGeo,mat(gem?'#7df9ff':'#ffd23f',{emissive:gem?'#1c8aa0':'#8a5a00'}));const s=gem?.75:.5;m.scale.set(s,s,s);m.position.set(R(-29,29),.7,R(-29,29));m.castShadow=true;world.add(m);coins.push({m,v:gem?10:1});};
  for(let i=0;i<34;i++)spawnCoin();
  const pads=EGGS.map((eg,i)=>{const x=-9+i*9,z=-8;const b=plat(x,.5,z,3,3,eg.c);emojiAt(eg.e,x,2.6,z,2.2,true);labelAt(`${eg.n} · ${eg.p} монет`,x,4.2,z,.48);return{b,eg,inside:false};});
  let followers=[];
  const rebuild=()=>{followers.forEach(f=>{world.remove(f.s);f.s.material.dispose();});const top=[...S.pets].sort((a,b)=>(PETS[b]||[0,1])[1]-(PETS[a]||[0,1])[1]).slice(0,3);followers=top.map((p,i)=>{const s=emojiSprite(p,1.15);s.position.copy(player.pos);world.add(s);return{s,i};});};
  rebuild();
  for(let k=0;k<2;k++){const b=spawnBot(R(-10,10),.1,R(-4,10),{speed:7});b.brain=()=>{let best=null,bd=16;for(const c of coins){const d=Math.hypot(c.m.position.x-b.pos.x,c.m.position.z-b.pos.z);if(d<bd){bd=d;best=c;}}return best?seekTo(b,best.m.position.x,best.m.position.z,.6):{dx:0,dz:0};};}
  let hatching=false;
  const hatch=eg=>{
    if(hatching)return;
    if(S.coins<eg.p){toast(`Для яйца нужно ещё ${eg.p-S.coins} монет`);return;}
    hatching=true;S.coins-=eg.p;updateCoins();const pet=pick(eg.pool);S.pets.push(pet);save();
    openModal(`<div class="egg">${eg.e}</div><h2>Яйцо открывается…</h2>`,{pause:false});
    const g0=G;setTimeout(()=>{
      if(G!==g0||G.ended){hatching=false;return;}
      const [nm,pw]=PETS[pet];sfx('win');
      openModal(`<div class="reveal">${pet}</div><h2>${nm}!</h2><p>Сила питомца: ×${pw}. Три самых сильных питомца ходят за тобой и умножают монеты.</p><p class="muted">Всего питомцев: ${S.pets.length}</p><div class="row"><button class="btn mint big" data-act="ok">Ура!</button></div>`,{pause:false,onAct:()=>{closeModal();}});
      rebuild();showBubble(player,{e:pet});hatching=false;
    },1300);
  };
  const OFF=[[-1.3,-1.1],[1.3,-1.1],[0,-2.2]];
  G.update=dt=>{
    const mult=petMult();
    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i];c.m.rotation.y+=dt*2;c.m.position.y=.7+Math.sin(G.time*3+i)*.12;
      for(const ch of [player,...bots]){
        if(Math.hypot(c.m.position.x-ch.pos.x,c.m.position.z-ch.pos.z)<1.3&&Math.abs(ch.pos.y+.5-c.m.position.y)<1.6){
          world.remove(c.m);coins.splice(i,1);if(ch.isPlayer){addCoins(c.v*mult);sfx('coin');}after(R(1,3),spawnCoin);break;
        }
      }
    }
    for(const p of pads){const ins=overlaps(player.pos,p.b,.08);if(ins&&!p.inside)hatch(p.eg);p.inside=ins;}
    const cs=Math.cos(player.face),sn=Math.sin(player.face),k=Math.min(1,dt*6);
    followers.forEach(f=>{const [ox,oz]=OFF[f.i];const tx=player.pos.x+ox*cs+oz*sn,tz=player.pos.z-ox*sn+oz*cs;f.s.position.x+=(tx-f.s.position.x)*k;f.s.position.z+=(tz-f.s.position.z)*k;f.s.position.y=player.pos.y+.8+Math.abs(Math.sin(G.time*5+f.i))*.35;});
  };

  G.intro='Собирай монеты и открывай яйца 🥚';
}

const TC=[{n:'красный',c:'#ff595e',s:'❤️'},{n:'жёлтый',c:'#ffca3a',s:'⭐'},{n:'зелёный',c:'#8ac926',s:'🍀'},{n:'синий',c:'#1982c4',s:'💧'},{n:'фиолетовый',c:'#9b5de5',s:'🍇'},{n:'оранжевый',c:'#ff924c',s:'🍊'}];
function startTiles(G){
  freshLevel({sky:'#f3e8ff'});
  const N=7,SZ=3,off=(N-1)*SZ/2,tiles=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const b=plat(i*SZ-off,0,j*SZ-off,SZ-.15,SZ-.15,'#fff');b.ci=0;tiles.push(b);}
  const paint=(t,ci)=>{t.ci=ci;t.mesh.material=tileMat(TC[ci].c,SZ-.15,SZ-.15);};
  const shuffle=()=>tiles.forEach(t=>paint(t,RI(0,5)));
  shuffle();
  G.spawn={x:0,y:0,z:0};G.killY=-7;
  for(let k=0;k<5;k++){const t=pick(tiles);const b=spawnBot(t.x,.1,t.z,{speed:R(6.8,7.8)});b.brain=()=>b.tt?seekTo(b,b.tt.x,b.tt.z):{dx:0,dz:0};}
  let round=0,phase='wait',pt=0,target=0,dur=5;const ROUNDS=12;
  const startPick=()=>{
    shuffle();target=RI(0,5);
    let cnt=tiles.filter(t=>t.ci===target).length;
    while(cnt<4){const t=pick(tiles);if(t.ci!==target){paint(t,target);cnt++;}}
    dur=Math.max(2.3,5-round*.25);phase='pick';pt=0;
    const good=tiles.filter(t=>t.ci===target);
    bots.forEach(b=>{if(b.out)return;const smart=Math.random()<.92-round*.035;const pool=smart?good:tiles;let best=pool[0],bd=1e9;for(const t of pool){const d=Math.hypot(t.x-b.pos.x,t.z-b.pos.z)+(smart?0:R(0,12));if(d<bd){bd=d;best=t;}}b.tt=best;});
  };
  G.onKill=ch=>{if(ch.isPlayer){endGame(false,{title:'Ты упал!',coins:round*6,detail:`Пройдено раундов: ${round}`});ch.out=true;ch.av.g.visible=false;}else{ch.out=true;ch.av.g.visible=false;}return true;};
  G.update=dt=>{
    pt+=dt;
    if(phase==='wait'&&pt>2.5)startPick();
    else if(phase==='pick'){const c=TC[target];big(`<span class="sw" style="background:${c.c}"></span>${c.s} ${c.n}!<small>${Math.ceil(dur-pt)}</small>`,0);if(pt>=dur){phase='drop';pt=0;tiles.forEach(t=>{if(t.ci!==target)t.active=false;});}}
    else if(phase==='drop'){big('',0);tiles.forEach(t=>{if(!t.active)t.mesh.position.y-=dt*9;});if(pt>2.2){tiles.forEach(t=>{t.active=true;t.mesh.position.y=t.y;});round++;if(round>=ROUNDS){endGame(true,{title:'Ты устоял все раунды!',coins:95,detail:`Осталось игроков: ${1+bots.filter(b=>!b.out).length}`});return;}phase='pause';pt=0;}}
    else if(phase==='pause'&&pt>.8)startPick();
  };
  G.info=()=>`Раунд ${Math.min(round+1,ROUNDS)} из ${ROUNDS} · игроков: ${1+bots.filter(b=>!b.out).length}`;
  G.intro='Встань на нужный цвет 🟪';
}

function emoteCode(it){if(it.t){const i=STICKERS.indexOf(it);return i>=0?100+i:-1;}return EMOJI.indexOf(it.e);}
function packState(full){
  const p=player.pos,ps=player.pose==='sit'?1:player.pose==='lie'?2:player.pose==='drive'?3:0;
  const st={v:1,nk:S.nk,sc:G?G.id:'hub',p:[+p.x.toFixed(2),+p.y.toFixed(2),+p.z.toFixed(2),+player.face.toFixed(2)],
    mv:Math.hypot(player.vel.x,player.vel.z)>.6?1:0,air:player.grounded?0:1,ps,hd:player.held?HELD_SET.indexOf(player.heldE):-1,e:NET.emo};
  if(full)st.lk=player.look;
  return st;
}
function netEmote(it){const c=emoteCode(it);if(c<0)return;NET.emo=[c,++NET.seq];NET.sendT=0;}
function peerState(key,raw){
  const st=sanitizeState(raw);if(!st){NET.peers.delete(key);return;}
  const prev=NET.peers.get(key);if(!st.lk&&prev)st.lk=prev.lk;
  st.t=performance.now();NET.peers.set(key,st);
}
function peerLeft(key){NET.peers.delete(key);const r=NET.remotes.get(key);if(r){world.remove(r.av.g);NET.remotes.delete(key);}}
function netTick(dt){
  if(NET.mode==='off'||!NET.t)return;
  const nowT=performance.now()/1000,rdt=Math.min(1,nowT-(NET.wall||nowT));NET.wall=nowT;
  NET.sendT-=rdt;NET.lookT-=rdt;
  if(NET.sendT<=0){NET.sendT=NET.t.interval;const lk=JSON.stringify(player.look);const full=lk!==NET.lastLookKey||NET.lookT<=0;if(full){NET.lastLookKey=lk;NET.lookT=3;}NET.t.send(packState(full));}
  const now=performance.now();let shown=0;
  for(const [key,st] of NET.peers){
    if(now-st.t>15000){peerLeft(key);continue;}
    const here=st.sc===G.id&&st.lk&&shown<30;let r=NET.remotes.get(key);
    if(!here){if(r){world.remove(r.av.g);NET.remotes.delete(key);}continue;}
    shown++;
    const lkKey=JSON.stringify(st.lk);
    if(!r){r=new Char(st.lk,nickOf(st.nk),false);r.remote=true;r.lkKey=lkKey;r.pos.set(st.p[0],st.p[1],st.p[2]);r.face=st.p[3];r.emoSeq=st.e[1];world.add(r.av.g);NET.remotes.set(key,r);}
    else if(r.lkKey!==lkKey){r.setLook(st.lk);r.lkKey=lkKey;}
    const k=Math.min(1,dt*10),ox=r.pos.x,oz=r.pos.z;
    r.pos.x+=(st.p[0]-r.pos.x)*k;r.pos.y+=(st.p[1]-r.pos.y)*k;r.pos.z+=(st.p[2]-r.pos.z)*k;
    if(Math.hypot(st.p[0]-r.pos.x,st.p[2]-r.pos.z)>8)r.pos.set(st.p[0],st.p[1],st.p[2]);
    r.face=lerpAng(r.face,st.p[3],k);
    r.vel.set(st.mv?(r.pos.x-ox)/Math.max(dt,1e-3):0,0,st.mv?(r.pos.z-oz)/Math.max(dt,1e-3):0);
    if(st.mv&&Math.hypot(r.vel.x,r.vel.z)<1){r.vel.x=Math.sin(r.face)*4;r.vel.z=Math.cos(r.face)*4;}
    r.grounded=!st.air;r.pose=st.ps===1?'sit':st.ps===2?'lie':st.ps===3?'drive':null;r.vehicle=null;
    if(st.hd!==r.hdIdx){r.hdIdx=st.hd;if(r.heldS){r.av.armR.remove(r.heldS);r.heldS.material.dispose();r.heldS=null;}if(st.hd>=0){const s=emojiSprite(HELD_SET[st.hd],.62);s.position.set(0,-.95,.2);r.av.armR.add(s);r.heldS=s;}}
    if(st.e[1]!==r.emoSeq){r.emoSeq=st.e[1];const it=emoteFromCode(st.e[0]);if(it)showBubble(r,it);}
    r.sync(dt);
  }
  for(const [key,r] of NET.remotes)if(!NET.peers.has(key)){world.remove(r.av.g);NET.remotes.delete(key);}
  let n=1;for(const st of NET.peers.values())if(st.lk)n++;NET.online=n;
  const pill=$('#netPill');if(pill){const txt=`🟢 ${n}`;if(pill.dataset.t!==txt){pill.dataset.t=txt;pill.textContent=txt;pill.hidden=false;}}
}
/* --- transport: Claude artifact room (everyone viewing the page) --- */
async function roomTransport(){
  if(!window.claude||!window.claude.use)return null;
  const room=await window.claude.use('room');if(!room)return null;
  room.onPeers(ch=>{
    for(const p of ch.left)peerLeft(p.peer);
    if(ch.joined.some(p=>!p.isMe))NET.lookT=0;
    for(const p of [...ch.joined,...ch.updated]){if(p.isMe||p.kind!=='viewer')continue;peerState(p.peer,p.presence&&p.presence.cv);}
  },()=>{NET.mode='off';});
  return{interval:1/12,send:st=>{room.presence({cv:st}).catch(()=>{});}};
}
/* --- transport: Supabase Realtime (standalone site) --- */
const CLOUD={sb:null,user:null,ch:null,saveT:null};
function supaTransport(){
  const sb=CLOUD.sb;if(!sb||!CLOUD.user)return null;
  const ch=sb.channel('cv-world',{config:{private:true,broadcast:{self:false},presence:{key:CLOUD.user.id}}});
  ch.on('broadcast',{event:'st'},({payload})=>{if(payload&&typeof payload.k==='string'&&payload.k.length<64&&payload.k!==CLOUD.user.id){if(!NET.peers.has(payload.k))NET.lookT=0;peerState(payload.k,payload.s);}})
    .on('presence',{event:'leave'},({key})=>{if(typeof key==='string')peerLeft(key);})
    .subscribe(async status=>{if(status==='SUBSCRIBED'){await ch.track({on:1});}});
  CLOUD.ch=ch;
  return{interval:1/6,send:st=>{ch.send({type:'broadcast',event:'st',payload:{k:CLOUD.user.id,s:st}});}};
}
async function netStart(kind){
  const t=kind==='supa'?supaTransport():await roomTransport();
  if(!t)return false;
  NET.t=t;NET.mode=kind;NET.lastLookKey='';
  toast(kind==='supa'?'Ты в сети! Друзья видят тебя 🟢':'Мультиплеер включён 🟢');
  return true;
}
/* --- cloud profile (Supabase) --- */
function cloudSave(){
  if(!CLOUD.sb||!CLOUD.user)return;
  clearTimeout(CLOUD.saveT);
  CLOUD.saveT=setTimeout(()=>{
    const save={coins:S.coins,pets:S.pets,look:S.look,owned:S.owned,wins:S.wins,home:S.home,homeColor:S.homeColor,genderChosen:S.genderChosen};
    CLOUD.sb.from('profiles').update({save,updated_at:new Date().toISOString()}).eq('id',CLOUD.user.id).then(()=>{},()=>{});
  },2500);
}
const PICS=['🍎','🐶','🚀','⭐','🌈','🐱','🍕','⚽','🎈','🦄','🌻','🐢','🍩','🎸','🐼','❄️'];
const kidEmail=nk=>`p${nk[0]}x${nk[1]}x${nk[2]}@kids.cubeville.app`;
const kidPass=(nk,pics)=>`cv-${pics.join('.')}-${nk.join('.')}`;
function openLogin(){
  const st={tab:'login',nk:S.nk&&sanitizeNk(S.nk)?S.nk.slice():[RI(0,ADJ.length-1),RI(0,ANIM.length-1),RI(1,99)],pics:[],first:null,busy:false,err:''};
  if(!(st.nk[2]>=1))st.nk[2]=RI(1,99);
  const render=()=>{
    const pick=`<div class="lgnick"><button class="btn" data-act="a-">◀</button><b>${ADJ[st.nk[0]]}</b><button class="btn" data-act="a+">▶</button></div>
      <div class="lgnick"><button class="btn" data-act="b-">◀</button><b>${ANIM[st.nk[1]]}</b><button class="btn" data-act="b+">▶</button></div>
      <div class="lgnick"><button class="btn" data-act="n-">◀</button><b>${st.nk[2]}</b><button class="btn" data-act="n+">▶</button><button class="btn" data-act="rnd" aria-label="Случайный ник">🎲</button></div>`;
    const dots=`<div class="lgdots">${[0,1,2,3].map(i=>`<span>${st.pics[i]!=null?PICS[st.pics[i]]:'·'}</span>`).join('')}</div>`;
    const grid=`<div class="lgpics">${PICS.map((p,i)=>`<button data-act="p${i}" aria-label="${p}">${p}</button>`).join('')}</div>`;
    const sub=st.tab==='new'?(st.first?'Повтори свой секрет из 4 картинок':'Придумай секрет: нажми 4 картинки по порядку'):'Нажми свои 4 картинки-секрет';
    openModal(`<div class="lgtabs"><button class="${st.tab==='login'?'on':''}" data-act="t-login">Войти</button><button class="${st.tab==='new'?'on':''}" data-act="t-new">Я новенький</button></div>
      <h2>${st.tab==='new'?'Создай игрока':'С возвращением!'}</h2>
      <p class="muted">Твоё имя в игре</p>${pick}
      <p class="muted">${sub}</p>${dots}${grid}
      ${st.err?`<p class="lgerr">${st.err}</p>`:''}
      <div class="row"><button class="btn" data-act="clr">Стереть</button><button class="btn" data-act="offline">Играть без входа</button></div>
      <p class="note">Никаких e-mail и настоящих имён. Секрет из картинок запомни или запиши с родителями.</p>`,
      {onAct:act});
  };
  const act=async a=>{
    if(st.busy)return;
    if(a==='t-login'||a==='t-new'){st.tab=a.slice(2);st.pics=[];st.first=null;st.err='';return render();}
    if(a==='a-'||a==='a+'){st.nk[0]=(st.nk[0]+(a==='a+'?1:ADJ.length-1))%ADJ.length;return render();}
    if(a==='b-'||a==='b+'){st.nk[1]=(st.nk[1]+(a==='b+'?1:ANIM.length-1))%ANIM.length;return render();}
    if(a==='n-'||a==='n+'){st.nk[2]=((st.nk[2]-1+(a==='n+'?1:98))%99)+1;return render();}
    if(a==='rnd'){st.nk=[RI(0,ADJ.length-1),RI(0,ANIM.length-1),RI(1,99)];return render();}
    if(a==='clr'){st.pics=[];st.err='';return render();}
    if(a==='offline'){closeModal();if(!S.genderChosen)askGender();return;}
    if(a[0]==='p'&&st.pics.length<4){st.pics.push(+a.slice(1));st.err='';
      if(st.pics.length<4)return render();
      if(st.tab==='new'&&!st.first){st.first=st.pics.slice();st.pics=[];return render();}
      if(st.tab==='new'&&st.first.join()!==st.pics.join()){st.first=null;st.pics=[];st.err='Картинки не совпали. Придумай секрет заново.';return render();}
      st.busy=true;openModal('<div class="card-ico">⏳</div><h2>Минутку…</h2>',{});
      const res=st.tab==='new'?await cloudRegister(st.nk,st.pics):await cloudLogin(st.nk,st.pics);
      st.busy=false;
      if(res.ok){closeModal();applyProfile(res.save);await netStart('supa');big(`Привет, ${nickOf(S.nk)}! 👋`,2.6);}
      else{st.pics=[];st.first=null;st.err=res.err;render();}
    }
  };
  render();
}
async function cloudRegister(nk,pics){
  if(!sanitizeNk(nk)||nk[2]<1)return{ok:false,err:'Выбери число от 1 до 99.'};
  try{
    const {data:taken}=await CLOUD.sb.rpc('nick_taken',{a:nk[0],b:nk[1],n:nk[2]});
    if(taken)return{ok:false,err:'Такое имя уже есть. Поменяй число или слово.'};
    const {data,error}=await CLOUD.sb.auth.signUp({email:kidEmail(nk),password:kidPass(nk,pics)});
    if(error||!data.user)return{ok:false,err:'Не получилось создать игрока. Попробуй ещё раз.'};
    if(!data.session){const r=await CLOUD.sb.auth.signInWithPassword({email:kidEmail(nk),password:kidPass(nk,pics)});if(r.error)return{ok:false,err:'Игрок создан, но вход не удался. Попробуй войти.'};}
    CLOUD.user=(await CLOUD.sb.auth.getUser()).data.user;
    S.nk=nk.slice();S.nick=nickOf(nk);
    const save={coins:S.coins,pets:S.pets,look:S.look,owned:S.owned,wins:S.wins,home:S.home,homeColor:S.homeColor,genderChosen:S.genderChosen};
    const {error:e2}=await CLOUD.sb.from('profiles').insert({id:CLOUD.user.id,nick_a:nk[0],nick_b:nk[1],nick_n:nk[2],save});
    if(e2)return{ok:false,err:'Такое имя уже занято. Поменяй число.'};
    return{ok:true,save};
  }catch(e){return{ok:false,err:'Нет связи с сервером. Проверь интернет.'};}
}
async function cloudLogin(nk,pics){
  try{
    const {error}=await CLOUD.sb.auth.signInWithPassword({email:kidEmail(nk),password:kidPass(nk,pics)});
    if(error)return{ok:false,err:'Имя или картинки не подходят. Попробуй ещё раз.'};
    CLOUD.user=(await CLOUD.sb.auth.getUser()).data.user;
    const {data}=await CLOUD.sb.from('profiles').select('nick_a,nick_b,nick_n,save').eq('id',CLOUD.user.id).single();
    if(data){S.nk=[data.nick_a,data.nick_b,data.nick_n];S.nick=nickOf(S.nk);}
    return{ok:true,save:data?data.save:null};
  }catch(e){return{ok:false,err:'Нет связи с сервером. Проверь интернет.'};}
}
function applyProfile(save){
  if(save&&typeof save==='object'){
    for(const k of ['coins','pets','owned','wins','home','homeColor','genderChosen'])if(save[k]!==undefined)S[k]=save[k];
    if(save.look)S.look=sanitizeLook(save.look);
  }
  if(typeof S.coins!=='number'||!isFinite(S.coins))S.coins=0;
  if(!Array.isArray(S.owned))S.owned=[];if(!Array.isArray(S.pets))S.pets=[];
  save_local();updateCoins();player.setLook(S.look);player.nick=nickOf(S.nk);
  if(!S.genderChosen)askGender();
}
async function cloudLogout(){if(!CLOUD.sb)return;try{await CLOUD.sb.auth.signOut();}catch(e){}location.reload();}
async function netInit(){
  const cfg=window.CUBEVILLE_CONFIG;
  if(cfg&&cfg.url&&cfg.anonKey&&window.supabase&&window.supabase.createClient){
    CLOUD.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
    let u=null;try{u=(await CLOUD.sb.auth.getUser()).data.user;}catch(e){}
    if(u){CLOUD.user=u;try{const {data}=await CLOUD.sb.from('profiles').select('nick_a,nick_b,nick_n,save').eq('id',u.id).single();if(data){S.nk=[data.nick_a,data.nick_b,data.nick_n];S.nick=nickOf(S.nk);applyProfile(data.save);}}catch(e){}await netStart('supa');}
    else openLogin();
    return;
  }
  if(cfg&&cfg.url)toast('Нет связи с сервером. Обнови страницу 🔄');
  await netStart('room');
}

/* ---------- boot ---------- */
function boot(){
  player=new Char(S.look,S.nick,true);scene.add(player.av.g);
  updateCoins();goHub();$('#loading').remove();
  setTimeout(netInit,600);
  if(window.CUBEVILLE_CONFIG&&window.CUBEVILLE_CONFIG.url){}else if(!S.genderChosen)askGender();else big(`Привет, ${S.nick}! 👋<small>Подойди к порталу или нажми «Игры»</small>`,3.2);
  joyIdle();
  requestAnimationFrame(t=>{last=t;frame(t);});
}
let booted=false;const go=()=>{if(!booted){booted=true;boot();}};
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);setTimeout(go,2000);}else go();
})();
</script>
